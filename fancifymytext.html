	<body>
		<h1>Fancify my Text</h1>
		
		
		<!--A field for users to enter large (multi-line) amounts of text-->
		<fieldset>
			<legend>Text</legend>
			<textarea id="textArea" rows="4" cols="30"></textarea>
		</fieldset>

		<!-- Your UI controls go here -->

		<!--Add a second bordered field set box labeled "Fancify" that contains the following controls:-->
		<!--A button labeled: Bigger! Two radio buttons labeled "FancyShmancy" and "BoringBetty"-->

		<fieldset>
			<legend>Fancify</legend>
		

		<!--<button type="button">Bigger!</button>-->
		<button onclick="makeBigger()">Bigger!</button>
		
		<!--fancy radio-->
		<input type="radio" id="fancyRadio" name="style" onchange="fancify_the_text()">
		<label for="fancyRadio">FancyShmancy</label>
		<!--boring radio-->
		<input type="radio" id="boringRadio" name="style" onchange="fancify_the_text()">
		<label for="boringRadio">BoringBetty</label>
		<!--moo radio-->
		<input type="radio" id="mooRadio" name="style" onchange="moo()">
		<label for="mooRadio">Moo</label>

		</fieldset>

		
		
	</body>
